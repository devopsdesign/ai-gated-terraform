name: plan-and-review

on:
  pull_request:
    paths: ["terraform/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init and validate
        run: |
          terraform init -input=false
          terraform validate

      - name: Plan
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -json tfplan > plan.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests for the review script
        working-directory: .
        run: |
          pip install pytest
          pytest -q tests

      - name: Review the plan
        id: review
        working-directory: .
        env:
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python scripts/ai_review.py terraform/plan.json --out review.md

      - name: Post the review on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review.md', 'utf8') + '\n<!-- plan-review -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.includes('<!-- plan-review -->'));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Flag high-risk plans
        if: steps.review.outputs.risk == 'high'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh label create risk:high --color B60205 --force
          gh pr edit ${{ github.event.pull_request.number }} --add-label risk:high
